<!doctype html><html><head><meta charset="utf-8"><title>LPL Writer</title>
<link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css"><script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script><link rel="stylesheet" href="lplWriter.css"></head><body>
<header><strong>LPL Writer <span>0.5.0</span></strong><button id="refresh">↻</button></header><main>
<section><div class="ttl">Selected manuscript</div><textarea id="selected" readonly></textarea><div id="selectionMeta" class="meta"></div></section>
<section><div class="ttl">Pinned operators</div><div id="favorites" class="grid"></div><button id="openLibrary" class="wide">Operator Library ▾</button></section>
<section><div class="ttl">Operator stack</div><div id="stack"></div><div class="meta">Combine operators and adjust strength before generating a preview.</div></section>
<section><div class="ttl">Natural-language direction</div><textarea id="instruction" placeholder="Add any specific editorial direction..."></textarea><div class="row"><button id="build">Build LPL</button><button id="send" class="primary">Generate preview</button></div></section>
<details><summary>Compiled LPL</summary><textarea id="lpl" readonly></textarea></details>
<section><div class="previewHead"><div class="ttl">Proposed revision</div><button id="expandPreview">Open large comparison</button></div><textarea id="preview"></textarea><div id="explanation" class="explain"></div><div class="row"><button id="accept" class="primary" disabled>Accept</button><button id="reject" disabled>Reject</button></div></section>
</main><div id="status" class="status neutral">Ready.</div>
<div id="libraryModal" class="modal hidden"><div class="shell"><div class="modalHead"><strong>LPL Operator Library</strong><button id="closeLibrary">✕</button></div><div class="libraryTools"><input id="search" placeholder="Search operators..."></div><div id="library" class="library"></div></div></div>
<div id="compareModal" class="modal hidden"><div class="shell"><div class="modalHead"><strong>LPL Revision Comparison</strong><button id="closeModal">✕</button></div><div class="compare"><div><div class="ttl">Original</div><textarea id="modalOriginal" readonly></textarea></div><div><div class="ttl">Proposed</div><textarea id="modalRevision"></textarea></div></div><div class="modalExplain"><div class="ttl">Explanation</div><div id="modalExplanation" class="explain"></div></div><div class="row actions"><button id="modalAccept" class="primary">Accept revision</button><button id="modalReject">Reject</button></div></div></div>
<script src="lpl-core.js"></script><script src="lplWriterPanel.js"></script></body></html>
